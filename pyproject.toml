[project]
name = "farmhealth"
version = "0.1.0"
description = "Sentinel-2 monthly NDVI mapping & timeseries over a German county via openEO/CDSE."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "geopandas>=1.1.3",
    "matplotlib>=3.11.0",
    "netcdf4>=1.7.4",
    "openeo>=0.50.0",
    "pandas>=2.3.3",
    "pyogrio>=0.12.1",
    "requests>=2.34.2",
    "shapely>=2.1.2",
    "xarray>=2025.1.1",
]
